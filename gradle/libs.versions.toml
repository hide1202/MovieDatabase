test-android_core = { module = "androidx.arch.core:core-testing", version.ref = "testAndroidTestCore" }
test-android_test_core = { module = "androidx.test:core", version.ref = "testAndroidCore" }
test-mockk = { module = "io.mockk:mockk", version.ref = "testMockk" }
test-mockk-agent-jvm = { module = "io.mockk:mockk-agent-jvm", version.ref = "testMockk" }
