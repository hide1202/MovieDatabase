androidx-room = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-datastore-prefs = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWorkmanager" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-uigraphics = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
