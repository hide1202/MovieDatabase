androidxPaging = "3.2.1"
androidxNavigation = "2.7.5"
androidxRoom = "2.6.0"
androidxDatastore = "1.0.0"
androidxWorkmanager = "2.8.1"

# Compose to Kotlin Compatibility Map: https://developer.android.com/jetpack/androidx/releases/compose-kotlin
# BOM to library version mapping: https://developer.android.com/jetpack/compose/bom/bom-mapping
composeBom = "2024.06.00"

testJunit = "4.13.2"
testStrikt = "0.34.1"
testAndroidTestCore = "2.2.0"
testAndroidCore = "1.5.0"
testMockk = "1.13.13"
