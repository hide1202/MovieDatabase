name: Android CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Build with Gradle and Jacoco
      run: ./gradlew --stacktrace clean koverXmlReportMerged
    - name: Codecov
      uses: codecov/codecov-action@v5
      with:
        flags: unittests
        disable_search: true
        files: ./build/reports/kover/reportMerged.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
