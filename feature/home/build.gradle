plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'

    alias(libs.plugins.compose.compiler)
}

apply from: "$rootDir/android-configure.gradle"
apply from: "$rootDir/android-jacoco.gradle"
apply from: "$rootDir/android-test-dependencies.gradle"

android {
    namespace "io.viewpoint.moviedatabase.feature.home"
    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation project(':core:resources')

    implementation project(':core:common')
    implementation project(':core:widget')
    implementation project(':core:model')
    implementation project(':core:api')
    implementation project(':core:designsystem')
    implementation project(':core:domain')

    implementation project(':feature:common-ui')

    // androidx
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.androidx.appcompat
    implementation libs.androidx.material.compose
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.paging

    // compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.uigraphics
    implementation libs.androidx.material3.compose
    implementation libs.compose.tooling.preview
    debugImplementation libs.compose.tooling

    // glide
    implementation libs.glide.compose

    // dagger/hilt
    implementation libs.hilt
    kapt libs.hilt.kapt
    // hilt with androidx
    kapt libs.androidx.hilt.kapt

    // timber
    implementation libs.timber
}