plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    alias(libs.plugins.kotlin.kover)
}

apply from: "$rootDir/android-configure.gradle"
apply from: "$rootDir/android-jacoco.gradle"
apply from: "$rootDir/android-test-dependencies.gradle"

android {
    namespace "io.viewpoint.moviedatabase.common"
}

dependencies {
    implementation project(':core:resources')

    implementation libs.androidx.core

    // timber
    implementation libs.timber

    // glide
    implementation libs.glide
    kapt libs.glide.kapt
}