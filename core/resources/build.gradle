plugins {
    id 'com.android.library'
    id 'kotlin-android'
    alias(libs.plugins.kotlin.kover)
}

apply from: "$rootDir/android-configure.gradle"

android {
    namespace "io.viewpoint.moviedatabase.resources"
}

dependencies {
    implementation libs.androidx.material
}

kover {
    currentProject {
        createVariant("merged") {
            add(["debug"], false)
        }
    }
}
